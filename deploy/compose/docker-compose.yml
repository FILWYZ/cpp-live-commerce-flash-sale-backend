name: live-commerce

x-app: &app
  image: live-commerce:local
  build:
    context: ../..
    dockerfile: deploy/docker/Dockerfile
  environment: &app-environment
    ECOMMERCE_INVENTORY_MODE: redis
    ECOMMERCE_FLASH_SALE_QUEUE: rabbitmq
    ECOMMERCE_REDIS_HOST: redis
    ECOMMERCE_MYSQL_HOST: mysql
    ECOMMERCE_MYSQL_PORT: 3306
    ECOMMERCE_MYSQL_USER: ecommerce
    ECOMMERCE_MYSQL_PASSWORD: ecommerce
    ECOMMERCE_MYSQL_DATABASE: ecommerce
    ECOMMERCE_RABBITMQ_HOST: rabbitmq
    ECOMMERCE_RABBITMQ_PORT: 5672
    ECOMMERCE_RABBITMQ_USER: ecommerce
    ECOMMERCE_RABBITMQ_PASSWORD: ecommerce
    ECOMMERCE_RABBITMQ_VHOST: /
    ECOMMERCE_RABBITMQ_EXCHANGE: flashsale.direct
    ECOMMERCE_RABBITMQ_COMMAND_QUEUE: flashsale.command.queue
    ECOMMERCE_RABBITMQ_DLQ_QUEUE: flashsale.command.dlq
    ECOMMERCE_ADMIN_TOKEN: ${ECOMMERCE_ADMIN_TOKEN:-dev-admin-token}
    ECOMMERCE_HTTP_WORKERS: ${ECOMMERCE_HTTP_WORKERS:-8}
    ECOMMERCE_HTTP_QUEUE_CAPACITY: ${ECOMMERCE_HTTP_QUEUE_CAPACITY:-4096}
    ECOMMERCE_HTTP_MAX_CONNECTIONS: ${ECOMMERCE_HTTP_MAX_CONNECTIONS:-10000}
    ECOMMERCE_FLASH_CONSUMER_WORKERS: ${ECOMMERCE_FLASH_CONSUMER_WORKERS:-4}
    ECOMMERCE_MYSQL_POOL_SIZE: ${ECOMMERCE_MYSQL_POOL_SIZE:-16}
    ECOMMERCE_DEMO_STOCK: ${ECOMMERCE_DEMO_STOCK:-100}
    ECOMMERCE_DEMO_CAMPAIGN_LIMIT: ${ECOMMERCE_DEMO_CAMPAIGN_LIMIT:-100}
    ECOMMERCE_ENABLE_TEST_FAULTS: ${ECOMMERCE_ENABLE_TEST_FAULTS:-0}
    ECOMMERCE_TEST_CRASH_POINT: ${ECOMMERCE_TEST_CRASH_POINT:-}
    ECOMMERCE_TEST_CRASH_MARKER: ${ECOMMERCE_TEST_CRASH_MARKER:-}
  depends_on: &dependencies
    redis: {condition: service_healthy}
    mysql: {condition: service_healthy}
    rabbitmq: {condition: service_healthy}
  restart: unless-stopped

services:
  api-server:
    <<: *app
    environment:
      <<: *app-environment
      ECOMMERCE_PROCESS_ROLE: api_server
    ports:
      - "${ECOMMERCE_GATEWAY_PUBLISHED_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/ready"]
      interval: 3s
      timeout: 2s
      retries: 20
      start_period: 5s

  order-consumer:
    <<: *app
    entrypoint: ["/app/order_consumer", "8080"]
    environment:
      <<: *app-environment
      ECOMMERCE_PROCESS_ROLE: order_consumer

  reconciler:
    <<: *app
    entrypoint: ["/app/reconciler", "8080"]
    environment:
      <<: *app-environment
      ECOMMERCE_PROCESS_ROLE: reconciler

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ecommerce
      RABBITMQ_DEFAULT_PASS: ecommerce
    ports:
      - "${ECOMMERCE_RABBITMQ_PUBLISHED_PORT:-5672}:5672"
      - "${ECOMMERCE_RABBITMQ_MANAGEMENT_PUBLISHED_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "${ECOMMERCE_REDIS_PUBLISHED_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ecommerce
      MYSQL_USER: ecommerce
      MYSQL_PASSWORD: ecommerce
      MYSQL_ROOT_PASSWORD: root-password
    ports:
      - "${ECOMMERCE_MYSQL_PUBLISHED_PORT:-13306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ../../src/storage/mysql/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot-password --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

volumes:
  rabbitmq-data:
  redis-data:
  mysql-data:
