services:
  gateway:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    ports:
      - "${ECOMMERCE_GATEWAY_PUBLISHED_PORT:-8080}:8080"
    environment:
      ECOMMERCE_REDIS_HOST: redis
      ECOMMERCE_INVENTORY_MODE: redis
      ECOMMERCE_FLASH_SALE_QUEUE: ${ECOMMERCE_FLASH_SALE_QUEUE:-redis}
      ECOMMERCE_KAFKA_BROKERS: redpanda:9092
      ECOMMERCE_ROCKETMQ_TLS: ${ECOMMERCE_ROCKETMQ_TLS:-false}
      ECOMMERCE_MYSQL_HOST: mysql
      ECOMMERCE_MYSQL_PORT: 3306
      ECOMMERCE_MYSQL_USER: ecommerce
      ECOMMERCE_MYSQL_PASSWORD: ecommerce
      ECOMMERCE_MYSQL_DATABASE: ecommerce
      ECOMMERCE_OUTBOX_PATH: /tmp/ecommerce-outbox.bin
      ECOMMERCE_STORAGE_SNAPSHOT: /tmp/ecommerce-domain.snapshot
      ECOMMERCE_STORAGE_WAL: /tmp/ecommerce-domain.wal
      ECOMMERCE_ADMIN_TOKEN: dev-admin-token
      ECOMMERCE_ADMIN_CREDENTIALS: ${ECOMMERCE_ADMIN_CREDENTIALS:-}
      ECOMMERCE_PAYMENT_CALLBACK_SECRET: ${ECOMMERCE_PAYMENT_CALLBACK_SECRET:-dev-payment-callback-secret}
      ECOMMERCE_FLASH_SALE_RATE_PER_SECOND: ${ECOMMERCE_FLASH_SALE_RATE_PER_SECOND:-10000}
      ECOMMERCE_FLASH_SALE_BURST: ${ECOMMERCE_FLASH_SALE_BURST:-2000}
      ECOMMERCE_FLASH_SALE_USER_RATE_PER_SECOND: ${ECOMMERCE_FLASH_SALE_USER_RATE_PER_SECOND:-2}
      ECOMMERCE_FLASH_SALE_USER_BURST: ${ECOMMERCE_FLASH_SALE_USER_BURST:-5}
      ECOMMERCE_FLASH_SALE_CAMPAIGN_RATE_PER_SECOND: ${ECOMMERCE_FLASH_SALE_CAMPAIGN_RATE_PER_SECOND:-10000}
      ECOMMERCE_FLASH_SALE_CAMPAIGN_BURST: ${ECOMMERCE_FLASH_SALE_CAMPAIGN_BURST:-2000}
      ECOMMERCE_FLASH_SALE_IP_RATE_PER_SECOND: ${ECOMMERCE_FLASH_SALE_IP_RATE_PER_SECOND:-10000}
      ECOMMERCE_FLASH_SALE_IP_BURST: ${ECOMMERCE_FLASH_SALE_IP_BURST:-10000}
      ECOMMERCE_FLASH_SALE_WAITING_ROOM: ${ECOMMERCE_FLASH_SALE_WAITING_ROOM:-true}
      ECOMMERCE_FLASH_SALE_WAITING_CAPACITY: ${ECOMMERCE_FLASH_SALE_WAITING_CAPACITY:-100000}
      ECOMMERCE_FLASH_SALE_WAITING_WORKERS: ${ECOMMERCE_FLASH_SALE_WAITING_WORKERS:-4}
      ECOMMERCE_TRUSTED_PROXY_IPS: ${ECOMMERCE_TRUSTED_PROXY_IPS:-}
      ECOMMERCE_HTTP_WORKERS: ${ECOMMERCE_HTTP_WORKERS:-8}
      ECOMMERCE_HTTP_QUEUE_CAPACITY: ${ECOMMERCE_HTTP_QUEUE_CAPACITY:-4096}
      ECOMMERCE_HTTP_MAX_CONNECTIONS: ${ECOMMERCE_HTTP_MAX_CONNECTIONS:-10000}
      ECOMMERCE_FLASH_CONSUMER_WORKERS: ${ECOMMERCE_FLASH_CONSUMER_WORKERS:-4}
      ECOMMERCE_MYSQL_POOL_SIZE: ${ECOMMERCE_MYSQL_POOL_SIZE:-16}
      ECOMMERCE_DEMO_STOCK: ${ECOMMERCE_DEMO_STOCK:-100}
      ECOMMERCE_DEMO_CAMPAIGN_LIMIT: ${ECOMMERCE_DEMO_CAMPAIGN_LIMIT:-100}
      ECOMMERCE_SNAPSHOT_INTERVAL_SECONDS: 30
    depends_on:
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      mysql:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - gateway-data:/tmp
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/ready"]
      interval: 3s
      timeout: 2s
      retries: 20
      start_period: 5s
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.1.2
    command: redpanda start --overprovisioned --smp 1 --memory 1G --reserve-memory 0M --check=false --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092 --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
    ports:
      - "${ECOMMERCE_REDPANDA_PUBLISHED_PORT:-19092}:19092"
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
    ports:
      - "${ECOMMERCE_REDIS_PUBLISHED_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ecommerce
      MYSQL_USER: ecommerce
      MYSQL_PASSWORD: ecommerce
      MYSQL_ROOT_PASSWORD: root-password
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot-password --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    ports:
      - "${ECOMMERCE_MYSQL_PUBLISHED_PORT:-13306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ../../src/storage/mysql/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro

  rocketmq-namesrv:
    image: apache/rocketmq:5.3.2
    profiles: ["rocketmq"]
    depends_on:
      rocketmq-init:
        condition: service_completed_successfully
    command: sh mqnamesrv
    ports:
      - "9876:9876"
    volumes:
      - rocketmq-namesrv-logs:/home/rocketmq/logs

  rocketmq-broker:
    image: apache/rocketmq:5.3.2
    profiles: ["rocketmq"]
    depends_on:
      rocketmq-namesrv:
        condition: service_started
      rocketmq-init:
        condition: service_completed_successfully
    environment:
      NAMESRV_ADDR: rocketmq-namesrv:9876
    command: sh mqbroker -c /home/rocketmq/rocketmq-5.3.2/conf/broker.conf
    ports:
      - "10909:10909"
      - "10911:10911"
      - "10912:10912"
    healthcheck:
      test: ["CMD-SHELL", "sh mqadmin clusterList -n rocketmq-namesrv:9876 | grep -q broker-a"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    volumes:
      - rocketmq-broker-logs:/home/rocketmq/logs
      - rocketmq-broker-store:/home/rocketmq/store

  rocketmq-proxy:
    image: apache/rocketmq:5.3.2
    profiles: ["rocketmq"]
    depends_on:
      rocketmq-topic-init:
        condition: service_completed_successfully
      rocketmq-namesrv:
        condition: service_started
    environment:
      NAMESRV_ADDR: rocketmq-namesrv:9876
    command: sh mqproxy -pc /home/rocketmq/rocketmq-5.3.2/conf/rmq-proxy.json
    ports:
      - "${ECOMMERCE_ROCKETMQ_HTTP_PUBLISHED_PORT:-18083}:8080"
      - "${ECOMMERCE_ROCKETMQ_PUBLISHED_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8081'"]
      interval: 3s
      timeout: 2s
      retries: 20
      start_period: 10s

  rocketmq-topic-init:
    image: apache/rocketmq:5.3.2
    profiles: ["rocketmq"]
    depends_on:
      rocketmq-broker:
        condition: service_healthy
    environment:
      NAMESRV_ADDR: rocketmq-namesrv:9876
    command:
      - sh
      - -c
      - >-
        sh mqadmin updateTopic -n rocketmq-namesrv:9876 -c DefaultCluster -t flashsale_command
        && sh mqadmin updateTopic -n rocketmq-namesrv:9876 -c DefaultCluster -t flashsale_dlq
        && sh mqadmin updateTopic -n rocketmq-namesrv:9876 -c DefaultCluster -t order_events
        && sh mqadmin updateTopic -n rocketmq-namesrv:9876 -c DefaultCluster -t inventory_events
        && sh mqadmin updateTopic -n rocketmq-namesrv:9876 -c DefaultCluster -t notification_events
        && sh mqadmin updateTopic -n rocketmq-namesrv:9876 -c DefaultCluster -t flashsale_smoke_test
        && sh mqadmin updateTopic -n rocketmq-namesrv:9876 -c DefaultCluster -t flashsale_dlq_test
        && sh mqadmin updateSubGroup -n rocketmq-namesrv:9876 -c DefaultCluster -g rocketmq-dlq-smoke -r 2 -p '{"type":"CUSTOMIZED","customizedRetryPolicy":{"next":[1000,1000]}}'
    restart: "no"

  rocketmq-init:
    image: apache/rocketmq:5.3.2
    profiles: ["rocketmq"]
    user: "0:0"
    command: sh -c "chown -R 3000:3000 /init/namesrv-logs /init/broker-logs /init/broker-store /init/proxy-logs"
    volumes:
      - rocketmq-namesrv-logs:/init/namesrv-logs
      - rocketmq-broker-logs:/init/broker-logs
      - rocketmq-broker-store:/init/broker-store
      - rocketmq-proxy-logs:/init/proxy-logs

volumes:
  redis-data:
  gateway-data:
  mysql-data:
  rocketmq-namesrv-logs:
  rocketmq-broker-logs:
  rocketmq-broker-store:
  rocketmq-proxy-logs:
