services:
  gateway:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.rocketmq
    environment:
      ECOMMERCE_FLASH_SALE_QUEUE: rocketmq
      ECOMMERCE_ROCKETMQ_ENDPOINT: rocketmq-proxy:8081
      ECOMMERCE_ROCKETMQ_COMMAND_TOPIC: flashsale.command
      ECOMMERCE_ROCKETMQ_DLQ_TOPIC: ${ECOMMERCE_ROCKETMQ_DLQ_TOPIC:-flashsale.dlq}
      ECOMMERCE_ROCKETMQ_CONSUMER_GROUP: flashsale-command-consumers
      ECOMMERCE_ROCKETMQ_TLS: "false"
      ECOMMERCE_ROCKETMQ_INVISIBLE_MS: ${ECOMMERCE_ROCKETMQ_INVISIBLE_MS:-120000}
      ECOMMERCE_KAFKA_BROKERS: ""
    depends_on:
      rocketmq-proxy:
        condition: service_healthy
