# Two API gateways and a separate background worker sharing Redis and MySQL
# orders. Start with:
# docker compose -f deploy/compose/docker-compose.multi.yml up --build
services:
  gateway-1:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    ports:
      - "${ECOMMERCE_GATEWAY_1_PUBLISHED_PORT:-8080}:8080"
    environment: &gateway-env
      ECOMMERCE_PROCESS_ROLE: gateway
      ECOMMERCE_INVENTORY_MODE: redis
      ECOMMERCE_FLASH_SALE_QUEUE: redis
      ECOMMERCE_REDIS_HOST: redis
      ECOMMERCE_KAFKA_BROKERS: redpanda:9092
      ECOMMERCE_MYSQL_HOSTS: mysql
      ECOMMERCE_MYSQL_PORT: 3306
      ECOMMERCE_MYSQL_USER: ecommerce
      ECOMMERCE_MYSQL_PASSWORD: ecommerce
      ECOMMERCE_MYSQL_DATABASE: ecommerce
      ECOMMERCE_OUTBOX_PATH: /tmp/ecommerce-outbox.bin
      ECOMMERCE_STORAGE_SNAPSHOT: /tmp/ecommerce-domain.snapshot
      ECOMMERCE_STORAGE_WAL: /tmp/ecommerce-domain.wal
      ECOMMERCE_ADMIN_TOKEN: dev-admin-token
    depends_on:
      redis: {condition: service_healthy}
      redpanda: {condition: service_healthy}
      mysql: {condition: service_healthy}
    volumes:
      - gateway-1-data:/tmp
    restart: unless-stopped

  gateway-2:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    ports:
      - "${ECOMMERCE_GATEWAY_2_PUBLISHED_PORT:-8081}:8080"
    environment:
      <<: *gateway-env
    depends_on:
      redis: {condition: service_healthy}
      redpanda: {condition: service_healthy}
      mysql: {condition: service_healthy}
    volumes:
      - gateway-2-data:/tmp
    restart: unless-stopped

  worker:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    environment:
      <<: *gateway-env
      ECOMMERCE_PROCESS_ROLE: worker
    depends_on:
      redis: {condition: service_healthy}
      redpanda: {condition: service_healthy}
      mysql: {condition: service_healthy}
    volumes:
      - worker-data:/tmp
    restart: unless-stopped

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.1.2
    command: redpanda start --overprovisioned --smp 1 --memory 1G --reserve-memory 0M --check=false --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092 --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
    ports: ["${ECOMMERCE_REDPANDA_PUBLISHED_PORT:-19092}:19092"]
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports: ["${ECOMMERCE_REDIS_PUBLISHED_PORT:-6379}:6379"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ecommerce
      MYSQL_USER: ecommerce
      MYSQL_PASSWORD: ecommerce
      MYSQL_ROOT_PASSWORD: root-password
    ports: ["${ECOMMERCE_MYSQL_PUBLISHED_PORT:-13306}:3306"]
    volumes:
      - mysql-data:/var/lib/mysql
      - ../../src/storage/mysql/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot-password --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  gateway-1-data:
  gateway-2-data:
  worker-data:
  redis-data:
  mysql-data:
